name: Publish Python package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    environment: pypi_bann
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux2014_x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: /opt/python/cp311-cp311/bin/python -m pip install --upgrade build auditwheel setuptools wheel Cython numpy

      - name: Build source distribution and wheel
        run: |
          /opt/python/cp311-cp311/bin/python -m build --sdist --wheel

      - name: Repair wheel for PyPI
        run: |
          mkdir -p wheelhouse
          auditwheel repair dist/*.whl -w wheelhouse
          cp dist/*.tar.gz wheelhouse/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse
